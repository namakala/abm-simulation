name: Test Slow

on:
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  test-slow:
    runs-on: ubuntu-latest
    name: Slow Tests (integration + calibration)
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          activate-environment: true
      - name: Run slow tests
        env:
          DOTENV_FILE: .env.example
        run: pixi run test-slow

  calibrate:
    runs-on: ubuntu-latest
    name: Calibration
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          activate-environment: true
      - name: Run calibration
        env:
          DOTENV_FILE: .env.example
        run: pixi run calibrate