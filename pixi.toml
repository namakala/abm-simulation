[workspace]
authors = ["lam <lamuri.aly8@gmail.com>"]
channels = ["conda-forge"]
name = "ABM"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
simulate = "python simulate.py"
test = "python -m pytest src/python/tests -m 'not slow and not config'"
test-cov = "python -m pytest src/python/tests --cov=src/python --cov-report=html --cov-fail-under=85 -m 'not slow and not config'"
test-unit = "python -m pytest src/python/tests -m unit"
test-integration = "python -m pytest src/python/tests -m integration"
test-config = "python -m pytest src/python/tests -m config --no-cov"
test-slow = "python -m pytest src/python/tests -m slow"
calibrate = "python src/python/calibration/run_full_calibration.py"
cumulative-blocks = "python -m src.python.demos.cumulative_blocks"
benchmark = "python -m pytest src/python/tests -k benchmark --benchmark-only"
lint = "ruff check src/python/"
format = "ruff format src/python/"
format-check = "ruff format --check src/python/"
type-check = "mypy --explicit-package-bases src/python/"
sort-imports = "isort src/python/"
security-bandit = "bandit -r src/python/"
extract-env = "bash src/shell/extract_env.sh"
update-env-example = "bash src/shell/update_env_example.sh"
parameterize = "bash src/shell/parameterize_env.sh"
force-parameterize = "bash src/shell/parameterize_env.sh --force"
install-hooks = "git config core.hooksPath .githooks"
quarto = "bash src/shell/quarto-render.sh"
article = "bash src/shell/article-render.sh"
serve = "quarto preview src/python/demos --port 9000 --no-browser"

[dependencies]
mesa = "3.3.0.*"
python = "3.12.11.*"
r-base = "4.5.1.*"
r-knitr = "*"
r-rmarkdown = "*"
networkx = "3.5.*"
pytest-mock = "*"
pandas = "2.3.2.*"
pytest-cov = "*"
hypothesis = "*"
bandit = "*"
pytest-html = "*"
safety = "*"
isort = "*"
numpy = "2.3.3.*"
pytest-xdist = "*"
pytest = "*"
python-dotenv = "*"
mypy = ">=2.3.0,<3"
faker = "*"
ruff = "*"
pytest-benchmark = "*"
coverage = "*"
matplotlib = "*"
seaborn = "*"
jupyter = ">=1.1.1,<2"
nbformat = ">=5.10.4,<6"
ipykernel = ">=7.3.0,<8"
types-networkx = ">=3.6.1.20260624,<4"
pandas-stubs = ">=3.0.3.260530,<4"
types-psutil = ">=7.2.2.20260518,<8"
scipy-stubs = ">=1.18.0.1,<2"
types-seaborn = ">=0.13.2.20240417,<0.14"
